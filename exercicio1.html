<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio1</title>
</head>
<body>
    <script>
      let nome = prompt("Qual é o seu nome?");
    let cidade = prompt("Em qual cidade você mora?");
    let hobby = prompt("O que você gosta de fazer no tempo livre?");

    alert("Prazer, " + nome + "! Você mora em " + cidade + " e curte " + hobby + ". Que legal!");

    // prompt pergunta e espera a pessoa digitar; alert só mostra uma mensagem.
    // nome fica sem aspas porque é uma variável, não um texto.
    </script>
</body>
</html>
