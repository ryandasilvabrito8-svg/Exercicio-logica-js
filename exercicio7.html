<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio7</title>
</head>
<body>
    <script>
        let opcao = prompt("Escolha um plano:\n1 - Básico\n2 - Padrão\n3 - Premium\n4 - Família");

        switch (opcao) {
            case "1": alert("Básico: R$ 20 por mês"); break;
            case "2": alert("Padrão: R$ 35 por mês"); break;
            case "3": alert("Premium: R$ 50 por mês"); break;
            case "4": alert("Família: R$ 60 por mês"); break;
            default: alert("Opção inválida");
        }

        // O break serve para sair do menu. Sem ele, o código continua e executa os próximos cases.
        // O default aparece quando a pessoa digita algo que não é nenhuma das opções, como 9.
        // Teste sem o break no case 1: digitando 1, aparecem 2 alerts (Básico e Padrão).
    </script>
</body>
</html>
